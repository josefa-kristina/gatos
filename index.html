<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gesture Meme Detector</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .split {
    display: flex;
    width: 100vw;
    height: 100vh;
  }
  .pane {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  #memeImg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  #debugHud {
    position: absolute;
    top: 8px;
    left: 8px;
    color: #f87cff;
    font: 13px/1.4 monospace;
    white-space: pre;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
    pointer-events: none;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="split">
    <div class="pane">
      <video id="video" playsinline muted autoplay></video>
      <div id="debugHud"></div>
    </div>
    <div class="pane">
      <img id="memeImg" src="bjorkReact/bjork.jpg" alt="" />
    </div>
  </div>

  <script type="module" src="appBjork.js"></script>
</body>
</html>
